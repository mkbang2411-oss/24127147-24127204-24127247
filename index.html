<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trình chiếu slide</title>
    <style>
      :root {
        --text: #fff;
        --muted: rgba(255, 255, 255, 0.75);
        --glass: rgba(255, 255, 255, 0.16);
        --glass-border: rgba(255, 255, 255, 0.35);
        --accent: #ffd36e;
        --fp: 12px; /* viền kính quanh slide */
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #3a0d14;
      }

      /* ===== Nền kính: màu lấy theo slide đang chiếu (vẽ 1 lần mỗi slide, không animate) ===== */
      #ambient {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background:
          radial-gradient(60% 60% at 15% 20%, #ff5a4d 0%, transparent 60%),
          radial-gradient(55% 55% at 85% 25%, #ffb347 0%, transparent 60%),
          radial-gradient(60% 60% at 60% 90%, #7b2cbf 0%, transparent 60%),
          #3a0d14;
      }
      #ambient canvas {
        position: absolute;
        inset: -8%;
        width: 116%;
        height: 116%;
        object-fit: cover;
        filter: blur(40px) saturate(1.4);
        display: none;
      }
      #ambient canvas.on {
        display: block;
      }
      #ambient::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(20, 8, 16, 0.2);
      }

      /* ===== Slide trong khung kính (không dùng backdrop-filter để khỏi lag) ===== */
      #stage {
        position: fixed;
        inset: 0 0 84px 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }
      body.fullscreen #stage {
        inset: 0;
        padding: 0;
      }
      #frame {
        padding: var(--fp);
        border-radius: 22px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
        display: flex;
      }
      body.fullscreen #frame {
        --fp: 0px;
        border: 0;
        border-radius: 0;
        background: none;
        box-shadow: none;
      }
      canvas#canvas {
        display: block;
        border-radius: 12px;
        background: #fff;
      }
      body.fullscreen canvas#canvas {
        border-radius: 0;
      }

      /* Chưa tải xong thì ẩn khung slide trắng và thanh điều khiển */
      body:not(.ready) #stage,
      body:not(.ready) #bar,
      body:not(.ready) #progress {
        visibility: hidden;
      }

      /* ===== Thanh tiến độ ===== */
      #progress {
        position: fixed;
        left: 0;
        top: 0;
        height: 4px;
        width: 0;
        z-index: 6;
        background: linear-gradient(90deg, #ffd36e, #ff7a59);
        box-shadow: 0 0 12px rgba(255, 160, 90, 0.8);
        transition: width 0.35s ease;
      }

      /* ===== Thanh điều khiển ===== */
      #bar {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
        transition:
          opacity 0.3s,
          transform 0.3s;
      }
      body.fullscreen.idle #bar {
        opacity: 0;
        transform: translate(-50%, 24px);
        pointer-events: none;
      }
      body.fullscreen.idle {
        cursor: none;
      }
      button {
        all: unset;
        cursor: pointer;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: 20px;
        color: var(--text);
        transition:
          background 0.15s,
          transform 0.15s;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      button:active {
        transform: scale(0.92);
      }
      #counter {
        min-width: 84px;
        text-align: center;
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      /* ===== Màn hình chờ ===== */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      #loader.hidden {
        display: none;
      }
      #loader .card {
        width: min(420px, 100%);
        text-align: center;
        padding: 44px 40px 40px;
        border-radius: 28px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }
      .spinner {
        width: 46px;
        height: 46px;
        margin: 0 auto 22px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.25);
        border-top-color: var(--accent);
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #loader h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      #loader p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      .meter {
        height: 6px;
        margin: 24px 0 10px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }
      .meter i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 99px;
        background: linear-gradient(90deg, #ffd36e, #ff7a59);
      }
      .meter.indeterminate i {
        width: 40%;
        animation: slide 1.3s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(280%);
        }
      }
      #pct {
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        color: var(--muted);
        min-height: 18px;
      }
      #loader.error .spinner,
      #loader.error .meter {
        display: none;
      }
      #retry {
        display: none;
        width: auto;
        height: auto;
        margin: 20px auto 0;
        padding: 11px 26px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
        color: #3a0d14;
        background: linear-gradient(135deg, #ffe08a, #ffa86b);
      }
      #loader.error #retry {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="ambient"><canvas id="bg"></canvas></div>
    <div id="progress"></div>

    <div id="loader">
      <div class="card">
        <div class="spinner"></div>
        <h1 id="title">Đang tải slide…</h1>
        <p id="sub">
          File hơi nặng nên cần chờ một chút, bạn đừng tắt trang nhé.
        </p>
        <div class="meter indeterminate" id="meter"><i id="fill"></i></div>
        <div id="pct"></div>
        <button id="retry">Tải lại</button>
      </div>
    </div>

    <div id="stage">
      <div id="frame"><canvas id="canvas"></canvas></div>
    </div>

    <div id="bar">
      <button id="prev" title="Slide trước (←)">‹</button>
      <span id="counter">0 / 0</span>
      <button id="next" title="Slide sau (→)">›</button>
      <button id="full" title="Toàn màn hình (F)">⛶</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      const PDF_FILE = "slides.pdf";

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      const $ = (id) => document.getElementById(id);
      const canvas = $("canvas"),
        ctx = canvas.getContext("2d");
      const bg = $("bg"),
        bgctx = bg.getContext("2d");
      const mid = document.createElement("canvas"); // trung gian để thu nhỏ mượt cho nền

      let pdf = null,
        base = null,
        page = 1,
        token = 0,
        curKey = "";
      const cache = new Map(); // trang -> canvas đã vẽ sẵn
      const inflight = new Map(); // trang -> promise đang vẽ

      // ---------- Tải PDF ----------
      function loadPdf() {
        const loader = $("loader");
        loader.classList.remove("hidden", "error");
        $("title").textContent = "Đang tải slide…";
        $("sub").textContent =
          "File hơi nặng nên cần chờ một chút, bạn đừng tắt trang nhé.";
        $("meter").classList.add("indeterminate");
        $("fill").style.width = "0";
        $("pct").textContent = "";

        const task = pdfjsLib.getDocument({ url: PDF_FILE });
        task.onProgress = ({ loaded, total }) => {
          if (!total) {
            $("pct").textContent = (loaded / 1048576).toFixed(1) + " MB";
            return;
          }
          const p = Math.min(100, Math.round((loaded / total) * 100));
          $("meter").classList.remove("indeterminate");
          $("fill").style.width = p + "%";
          $("pct").textContent =
            p +
            "%  ·  " +
            (loaded / 1048576).toFixed(1) +
            " / " +
            (total / 1048576).toFixed(1) +
            " MB";
        };

        task.promise
          .then(async (doc) => {
            pdf = doc;
            base = (await pdf.getPage(1)).getViewport({ scale: 1 });
            await show(1);
            document.body.classList.add("ready");
            loader.classList.add("hidden");
          })
          .catch((err) => {
            loader.classList.add("error");
            $("title").textContent = "Chưa tải được slide";
            $("sub").textContent = "Bạn kiểm tra mạng rồi bấm “Tải lại” nhé.";
            $("pct").textContent = err && err.message ? err.message : "";
          });
      }
      $("retry").onclick = loadPdf;

      // ---------- Vẽ trước các slide để chuyển trang tức thì ----------
      function computeSize() {
        const stage = $("stage"),
          cs = getComputedStyle(stage);
        const fp = parseFloat(getComputedStyle($("frame")).paddingLeft) || 0;
        const w = stage.clientWidth - parseFloat(cs.paddingLeft) * 2 - fp * 2;
        const h =
          stage.clientHeight -
          parseFloat(cs.paddingTop) -
          parseFloat(cs.paddingBottom) -
          fp * 2;
        const scale = Math.min(w / base.width, h / base.height);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const cssW = Math.floor(base.width * scale),
          cssH = Math.floor(base.height * scale);
        return { scale, dpr, cssW, cssH, key: cssW + "x" + cssH + "@" + dpr };
      }

      function getBitmap(n, size) {
        if (cache.has(n)) return Promise.resolve(cache.get(n));
        if (inflight.has(n)) return inflight.get(n);
        const p = (async () => {
          const pg = await pdf.getPage(n);
          const vp = pg.getViewport({ scale: size.scale * size.dpr });
          const c = document.createElement("canvas");
          c.width = Math.round(vp.width);
          c.height = Math.round(vp.height);
          await pg.render({ canvasContext: c.getContext("2d"), viewport: vp })
            .promise;
          if (size.key === curKey) cache.set(n, c);
          inflight.delete(n);
          return c;
        })();
        inflight.set(n, p);
        return p;
      }

      async function show(n) {
        const my = ++token;
        page = n;
        const size = computeSize();
        if (size.key !== curKey) {
          curKey = size.key;
          cache.clear();
          inflight.clear();
        }
        const c = await getBitmap(n, size);
        if (my !== token) return;
        canvas.width = c.width;
        canvas.height = c.height;
        canvas.style.width = size.cssW + "px";
        canvas.style.height = size.cssH + "px";
        ctx.drawImage(c, 0, 0);
        paintAmbient();
        updateUI();
        prefetch(n, size);
      }

      async function prefetch(n, size) {
        for (const k of cache.keys()) if (Math.abs(k - n) > 3) cache.delete(k);
        for (const k of [n + 1, n + 2, n - 1]) {
          if (k < 1 || k > pdf.numPages || size.key !== curKey) continue;
          await getBitmap(k, size);
        }
      }

      // Nền kính: thu nhỏ 2 bước rồi để CSS làm mờ
      function paintAmbient() {
        const r = canvas.height / canvas.width;
        mid.width = 192;
        mid.height = Math.max(1, Math.round(192 * r));
        mid.getContext("2d").drawImage(canvas, 0, 0, mid.width, mid.height);
        bg.width = 32;
        bg.height = Math.max(1, Math.round(32 * r));
        bgctx.drawImage(mid, 0, 0, bg.width, bg.height);
        bg.classList.add("on");
      }

      function updateUI() {
        $("counter").textContent = page + " / " + pdf.numPages;
        $("progress").style.width = (page / pdf.numPages) * 100 + "%";
      }

      function go(n) {
        if (!pdf) return;
        const t = Math.max(1, Math.min(pdf.numPages, n));
        if (t !== page) show(t);
      }

      // ---------- Điều khiển ----------
      $("prev").onclick = () => go(page - 1);
      $("next").onclick = () => go(page + 1);
      $("full").onclick = toggleFull;
      function toggleFull() {
        document.fullscreenElement
          ? document.exitFullscreen()
          : document.documentElement.requestFullscreen();
      }
      document.addEventListener("fullscreenchange", () => {
        document.body.classList.toggle(
          "fullscreen",
          !!document.fullscreenElement,
        );
        if (pdf) show(page);
      });

      document.addEventListener("keydown", (e) => {
        if (
          ["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)
        ) {
          e.preventDefault();
          go(page + 1);
        } else if (
          ["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)
        ) {
          e.preventDefault();
          go(page - 1);
        } else if (e.key === "Home") go(1);
        else if (e.key === "End") go(pdf ? pdf.numPages : 1);
        else if (e.key.toLowerCase() === "f") toggleFull();
      });

      $("stage").addEventListener("click", (e) =>
        go(e.clientX < innerWidth / 2 ? page - 1 : page + 1),
      );

      let tx = 0;
      $("stage").addEventListener(
        "touchstart",
        (e) => (tx = e.touches[0].clientX),
        { passive: true },
      );
      $("stage").addEventListener("touchend", (e) => {
        const dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 50) go(page + (dx < 0 ? 1 : -1));
      });

      let idleTimer;
      document.addEventListener("mousemove", () => {
        document.body.classList.remove("idle");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => document.body.classList.add("idle"), 2500);
      });

      let rt;
      addEventListener("resize", () => {
        clearTimeout(rt);
        rt = setTimeout(() => pdf && show(page), 200);
      });

      loadPdf();
    </script>
  </body>
</html>
