<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trình chiếu slide</title>
    <style>
      :root {
        --text: #fff;
        --muted: rgba(255, 255, 255, 0.7);
        --glass: rgba(255, 255, 255, 0.14);
        --glass-strong: rgba(255, 255, 255, 0.22);
        --glass-border: rgba(255, 255, 255, 0.35);
        --accent: #ffd36e;
        --fp: 12px; /* viền kính quanh slide */
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #3a0d14;
      }

      /* ===== Nền kính: màu ánh theo từng slide ===== */
      #ambient {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background:
          radial-gradient(60% 60% at 15% 20%, #ff5a4d 0%, transparent 60%),
          radial-gradient(55% 55% at 85% 25%, #ffb347 0%, transparent 60%),
          radial-gradient(60% 60% at 60% 90%, #7b2cbf 0%, transparent 60%),
          #3a0d14;
      }
      #ambient canvas {
        position: absolute;
        inset: -8%;
        width: 116%;
        height: 116%;
        object-fit: cover;
        filter: blur(48px) saturate(1.5) brightness(0.95);
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #ambient canvas.on {
        opacity: 1;
      }
      #ambient::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(20, 8, 16, 0.18);
      }

      /* ===== Slide trong khung kính ===== */
      #stage {
        position: fixed;
        inset: 0 0 84px 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }
      body.fullscreen #stage {
        inset: 0;
        padding: 0;
      }
      #frame {
        padding: var(--fp);
        border-radius: 22px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
        display: flex;
      }
      body.fullscreen #frame {
        --fp: 0px;
        border: 0;
        border-radius: 0;
        background: none;
        box-shadow: none;
        backdrop-filter: none;
      }
      canvas#canvas {
        display: block;
        border-radius: 12px;
        background: #fff;
        transition: opacity 0.25s ease;
      }
      body.fullscreen canvas#canvas {
        border-radius: 0;
      }
      canvas#canvas.loading {
        opacity: 0.5;
      }

      /* ===== Thanh tiến độ ===== */
      #progress {
        position: fixed;
        left: 0;
        top: 0;
        height: 4px;
        width: 0;
        z-index: 6;
        background: linear-gradient(90deg, #ffd36e, #ff7a59);
        box-shadow: 0 0 12px rgba(255, 160, 90, 0.8);
        transition: width 0.35s ease;
      }

      /* ===== Thanh điều khiển kính ===== */
      #bar {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(20px) saturate(1.4);
        -webkit-backdrop-filter: blur(20px) saturate(1.4);
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
        transition:
          opacity 0.3s,
          transform 0.3s;
      }
      body.fullscreen.idle #bar {
        opacity: 0;
        transform: translate(-50%, 24px);
        pointer-events: none;
      }
      body.fullscreen.idle {
        cursor: none;
      }
      button {
        all: unset;
        cursor: pointer;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: 20px;
        color: var(--text);
        transition:
          background 0.15s,
          transform 0.15s;
      }
      button:hover {
        background: var(--glass-strong);
      }
      button:active {
        transform: scale(0.92);
      }
      #counter {
        min-width: 84px;
        text-align: center;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      /* ===== Màn hình chọn file ===== */
      #drop {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      #drop.hidden {
        display: none;
      }
      #drop .card {
        text-align: center;
        padding: 44px 52px;
        border-radius: 28px;
        max-width: 460px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }
      #drop h1 {
        font-size: 26px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      #drop p {
        color: var(--muted);
        font-size: 15px;
      }
      #drop .hint {
        font-size: 13px;
        margin-top: 18px;
      }
      #drop label {
        display: inline-block;
        margin-top: 22px;
        padding: 12px 28px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
        color: #3a0d14;
        background: linear-gradient(135deg, #ffe08a, #ffa86b);
        box-shadow: 0 6px 18px rgba(255, 150, 80, 0.4);
        transition: transform 0.15s;
      }
      #drop label:hover {
        transform: translateY(-1px);
      }
      #drop input {
        display: none;
      }
      body.dragover #drop .card {
        outline: 2px dashed var(--accent);
        outline-offset: 8px;
      }
    </style>
  </head>
  <body>
    <div id="ambient"><canvas id="bg"></canvas></div>
    <div id="progress"></div>

    <div id="drop">
      <div class="card">
        <h1>Trình chiếu slide PDF</h1>
        <p>Kéo thả file PDF vào đây hoặc bấm nút bên dưới</p>
        <label
          >Chọn file PDF<input type="file" id="file" accept="application/pdf"
        /></label>
        <p class="hint">← → hoặc Space để chuyển slide · F để toàn màn hình</p>
      </div>
    </div>

    <div id="stage">
      <div id="frame"><canvas id="canvas"></canvas></div>
    </div>

    <div id="bar">
      <button id="prev" title="Slide trước (←)">‹</button>
      <span id="counter">0 / 0</span>
      <button id="next" title="Slide sau (→)">›</button>
      <button id="full" title="Toàn màn hình (F)">⛶</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      // ====== CẤU HÌNH ======
      const DEFAULT_PDF = "slides.pdf"; // để "" nếu muốn luôn hiện màn hình chọn file
      // ======================

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      const $ = (id) => document.getElementById(id);
      const canvas = $("canvas"),
        ctx = canvas.getContext("2d");
      const bg = $("bg"),
        bgctx = bg.getContext("2d");
      let pdf = null,
        page = 1,
        renderTask = null,
        pending = null;

      async function openPdf(source) {
        pdf = await pdfjsLib.getDocument(source).promise;
        page = 1;
        $("drop").classList.add("hidden");
        render();
      }

      async function render() {
        if (!pdf) return;
        if (renderTask) {
          pending = page;
          renderTask.cancel();
          return;
        }
        canvas.classList.add("loading");
        const pg = await pdf.getPage(page);
        const base = pg.getViewport({ scale: 1 });
        const stage = $("stage"),
          cs = getComputedStyle(stage);
        const fp = parseFloat(getComputedStyle($("frame")).paddingLeft) || 0;
        const w = stage.clientWidth - parseFloat(cs.paddingLeft) * 2 - fp * 2;
        const h =
          stage.clientHeight -
          parseFloat(cs.paddingTop) -
          parseFloat(cs.paddingBottom) -
          fp * 2;
        const scale = Math.min(w / base.width, h / base.height);
        const dpr = window.devicePixelRatio || 1;
        const vp = pg.getViewport({ scale: scale * dpr });
        canvas.width = vp.width;
        canvas.height = vp.height;
        canvas.style.width = vp.width / dpr + "px";
        canvas.style.height = vp.height / dpr + "px";
        renderTask = pg.render({ canvasContext: ctx, viewport: vp });
        try {
          await renderTask.promise;
          paintAmbient();
        } catch (e) {
          /* bị hủy do đổi trang nhanh */
        }
        renderTask = null;
        canvas.classList.remove("loading");
        updateUI();
        if (pending !== null) {
          pending = null;
          render();
        }
      }

      // Lấy màu của slide hiện tại làm nền kính mờ phía sau
      function paintAmbient() {
        bg.width = 64;
        bg.height = Math.max(
          1,
          Math.round((64 * canvas.height) / canvas.width),
        );
        bgctx.drawImage(canvas, 0, 0, bg.width, bg.height);
        bg.classList.add("on");
      }

      function updateUI() {
        $("counter").textContent = page + " / " + pdf.numPages;
        $("progress").style.width = (page / pdf.numPages) * 100 + "%";
      }

      function go(n) {
        if (!pdf) return;
        const t = Math.max(1, Math.min(pdf.numPages, n));
        if (t !== page) {
          page = t;
          render();
        }
      }

      // Điều khiển
      $("prev").onclick = () => go(page - 1);
      $("next").onclick = () => go(page + 1);
      $("full").onclick = toggleFull;
      function toggleFull() {
        document.fullscreenElement
          ? document.exitFullscreen()
          : document.documentElement.requestFullscreen();
      }
      document.addEventListener("fullscreenchange", () => {
        document.body.classList.toggle(
          "fullscreen",
          !!document.fullscreenElement,
        );
        render();
      });

      document.addEventListener("keydown", (e) => {
        if (
          ["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)
        ) {
          e.preventDefault();
          go(page + 1);
        } else if (
          ["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)
        ) {
          e.preventDefault();
          go(page - 1);
        } else if (e.key === "Home") go(1);
        else if (e.key === "End") go(pdf ? pdf.numPages : 1);
        else if (e.key.toLowerCase() === "f") toggleFull();
      });

      // Bấm nửa trái/phải màn hình để chuyển slide
      $("stage").addEventListener("click", (e) =>
        go(e.clientX < innerWidth / 2 ? page - 1 : page + 1),
      );

      // Vuốt trên điện thoại
      let tx = 0;
      $("stage").addEventListener(
        "touchstart",
        (e) => (tx = e.touches[0].clientX),
        { passive: true },
      );
      $("stage").addEventListener("touchend", (e) => {
        const dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 50) go(page + (dx < 0 ? 1 : -1));
      });

      // Tự ẩn thanh điều khiển khi toàn màn hình
      let idleTimer;
      document.addEventListener("mousemove", () => {
        document.body.classList.remove("idle");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => document.body.classList.add("idle"), 2500);
      });

      // Chọn file / kéo thả
      const loadFile = (f) => {
        if (f && f.type === "application/pdf")
          f.arrayBuffer().then((b) => openPdf({ data: b }));
      };
      $("file").onchange = (e) => loadFile(e.target.files[0]);
      ["dragenter", "dragover"].forEach((ev) =>
        document.addEventListener(ev, (e) => {
          e.preventDefault();
          document.body.classList.add("dragover");
        }),
      );
      ["dragleave", "drop"].forEach((ev) =>
        document.addEventListener(ev, (e) => {
          e.preventDefault();
          document.body.classList.remove("dragover");
        }),
      );
      document.addEventListener("drop", (e) =>
        loadFile(e.dataTransfer.files[0]),
      );

      // Vẽ lại khi đổi kích thước cửa sổ
      let rt;
      addEventListener("resize", () => {
        clearTimeout(rt);
        rt = setTimeout(render, 150);
      });

      if (DEFAULT_PDF) openPdf(DEFAULT_PDF).catch(() => {});
    </script>
  </body>
</html>
